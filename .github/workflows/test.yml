name: Test formula

# Runs on the same arch the formula requires (depends_on arch: :arm64) —
# macos-14 GitHub runners are Apple Silicon, so `brew install` here
# exercises the exact same download+checksum+extract path a real user's
# Mac would, without touching anyone's actual machine. Also the only real
# check of the risk flagged in anywh's journal/62-distribuicao-instalacao-
# plano.md §"Fase 4": whether the node-pty binary node-gyp compiled in
# anywh's CI actually loads under Homebrew's own `node`, and now whether
# `brew services start` actually boots the relay and opens its port —
# runner is destroyed after the job either way, so nothing here ever
# touches a real machine or leaves anything behind.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # `brew audit`/`brew install` on a bare path is disabled by newer
      # Homebrew — tap this checkout locally so both can address the
      # formula by name, the same way a real `brew tap anywh-sh/tap`
      # would.
      - run: brew tap anywh-sh/tap "$PWD"

      - run: brew audit --strict anywh-sh/tap/anywh-relay

      - run: brew install anywh-sh/tap/anywh-relay

      - name: Confirm node-pty loads under Homebrew's node
        run: |
          libexec="$(brew --prefix anywh-relay)/libexec"
          "$(brew --prefix node)/bin/node" -e "require('$libexec/relay/node_modules/node-pty'); console.log('node-pty loaded OK')"

      # Same script + --mode dev the formula's own caveats tell a real
      # user to run — writes ~/.config/anywh/env/default.env, never
      # touches systemd/launchd itself (that part is brew services'
      # job below).
      - name: Create the "default" profile
        run: |
          libexec="$(brew --prefix anywh-relay)/libexec"
          "$libexec/infra/systemd/add-profile.sh" default --mode dev --relay-host 127.0.0.1

      # Debug aid: `brew services` swallows stdout/stderr into log_path/
      # error_log_path, and the previous run showed both empty — running
      # the exact same command in the foreground surfaces whatever
      # launchd was hiding.
      - name: Debug — run the service's exact command in the foreground
        run: |
          libexec="$(brew --prefix anywh-relay)/libexec"
          "$(brew --prefix node)/bin/node" "--env-file-if-exists=$HOME/.config/anywh/env/default.env" "$libexec/relay/dist/server.js" > /tmp/debug.out 2>&1 &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 3s (good sign) — killing for cleanup"
            kill "$pid"
          else
            echo "process already exited"
          fi
          echo "--- captured output ---"
          cat /tmp/debug.out

      - name: Debug — dump the generated launchd plist
        run: cat "$HOME/Library/LaunchAgents/homebrew.mxcl.anywh-relay.plist"

      - name: Start the service and confirm it opens its port
        run: |
          brew services start anywh-relay
          port="$(grep '^RELAY_PORT=' "$HOME/.config/anywh/env/default.env" | cut -d= -f2)"
          echo "waiting on port $port"
          for _ in $(seq 1 15); do
            nc -z localhost "$port" && break
            sleep 1
          done
          if ! nc -z localhost "$port"; then
            echo "::error::relay never opened port $port"
            brew services info anywh-relay
            cat "$(brew --prefix)/var/log/anywh-relay.error.log" 2>/dev/null
            exit 1
          fi
          echo "relay is listening on port $port"

      - name: Stop the service
        if: always()
        run: brew services stop anywh-relay
